name: Actualizar datos

# Un solo flujo de Power Automate avisa de cualquier Excel de EDU CONTINUA (evento excel-actualizado) con la ruta de su carpeta
# y las filas de la tabla. Si el Excel es el Registro de cursos se actualiza config/cursos.json. Si es el de un curso se reconoce por su ruta,
# se reconstruyen solo sus datos y se publica el sitio.
on:
  repository_dispatch:
    types: [excel-actualizado]
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'README.md', 'tests/**', 'referencias/**', 'cursos/**']

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  construir:
    runs-on: ubuntu-latest
    # Un grupo por curso: dos guardados del mismo Excel se hacen en orden y el último gana; cursos distintos no se pisan
    concurrency:
      group: construir-${{ github.event.client_payload.ruta || github.ref }}
      cancel-in-progress: false
    outputs:
      desplegar: ${{ steps.decidir.outputs.desplegar }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt pytest icalendar

      - name: Pruebas de datos y registro de cursos
        run: pytest tests/test_datos.py tests/test_cursos.py tests/test_alertas.py -q

      - name: Reconocer el aviso (registro de cursos o Excel de un curso)
        if: github.event_name == 'repository_dispatch'
        id: fuente
        # La carga útil se lee del archivo del evento, nunca de una variable de entorno: así no se imprime en el registro público
        run: python scripts/cursos.py recibir "$GITHUB_EVENT_PATH"

      - name: Aplicar el Excel Registro de cursos
        if: steps.fuente.outputs.tipo == 'registro'
        id: registro
        continue-on-error: true
        run: python scripts/cursos.py registro fuente.json

      - name: Anotar la carpeta sin registrar
        if: steps.fuente.outputs.tipo == 'ninguno'
        run: python scripts/cursos.py sinregistrar "$GITHUB_EVENT_PATH"

      - name: Validar y construir el curso
        if: steps.fuente.outputs.curso != ''
        id: construir
        continue-on-error: true
        env:
          CURSO: ${{ steps.fuente.outputs.curso }}
          MODIFICADO: ${{ steps.fuente.outputs.modificado }}
        run: |
          set +e
          python scripts/construir_datos.py fuente.json --json --raiz "cursos/$CURSO" --modificado "$MODIFICADO" 2>&1 | tee salida.txt
          estado=${PIPESTATUS[0]}
          {
            echo "## Actualizar datos: $CURSO"
            echo '```'; cat salida.txt; echo '```'
            [ "$estado" -eq 0 ] || echo "**Falló: se conserva el último data.json bueno de este curso.**"
          } >> "$GITHUB_STEP_SUMMARY"
          exit $estado

      - name: Avisos de cambio de fecha a los estudiantes (grupo de Teams)
        if: steps.fuente.outputs.curso != ''
        env:
          GH_TOKEN: ${{ secrets.AVISOS_TOKEN }}
          COLA: ${{ github.repository_owner }}/avisos-internos
          RESPONSABLE: ${{ vars.RESPONSABLE_AVISOS }}
          CURSO: ${{ steps.fuente.outputs.curso }}
          ACTIVOS: ${{ vars.AVISOS_ESTUDIANTES }}
        # APAGADO por defecto: sin AVISOS_ESTUDIANTES=true solo se anotan los cambios como vistos y no se publica nada.
        # Cada aviso es una incidencia en el repositorio PRIVADO avisos-internos que un flujo de Power Automate publica en el grupo de Teams del curso.
        run: |
          python scripts/avisos.py "$CURSO" avisos.json
          n=$(jq length avisos.json)
          if [ "$n" -gt 0 ] && [ "$ACTIVOS" = "true" ] && [ -z "$GH_TOKEN" ]; then
            echo "Hay $n aviso(s) para estudiantes pero falta el secreto AVISOS_TOKEN. No se publicó nada." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$n" -gt 0 ] && [ "$ACTIVOS" = "true" ]; then
            gh label create aviso-estudiantes -R "$COLA" --color 0E8A16 2>/dev/null || true
            jq -c '.[]' avisos.json | while read -r a; do
              gh issue create -R "$COLA" --title "$(jq -r .titulo <<<"$a")" --body "$(jq -r .cuerpo <<<"$a")" --label aviso-estudiantes --assignee "$RESPONSABLE"
              echo "Aviso publicado en la cola interna." >> "$GITHUB_STEP_SUMMARY"
            done
          elif [ "$n" -gt 0 ]; then
            echo "Hay $n aviso(s) de cambio de fecha para estudiantes, pero el envío está apagado (AVISOS_ESTUDIANTES no es true). No se publicó nada." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publicar cambios en el repositorio
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cursos config estado
          if git diff --cached --quiet; then
            echo "hay=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Actualizar datos desde el Excel"
            for i in 1 2 3 4; do
              git pull --rebase origin main && git push origin HEAD:main && break
              sleep $((i * 3))
            done
            echo "hay=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Decidir si se despliega
        id: decidir
        run: |
          # Se despliega si cambiaron los datos (o el aviso de error) o si es un push o ejecución manual
          if [ "${{ steps.commit.outputs.hay }}" = "true" ] || [ "${{ github.event_name }}" != "repository_dispatch" ]; then
            echo "desplegar=true" >> "$GITHUB_OUTPUT"
          else
            echo "desplegar=false" >> "$GITHUB_OUTPUT"
            echo "Sin cambios en los datos: no se despliega." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Marcar la ejecución como fallida si el Excel no se pudo leer
        if: steps.construir.outcome == 'failure' || steps.registro.outcome == 'failure'
        run: exit 1

  desplegar:
    needs: construir
    # always(): si el Excel falló, igual se publica para que el sitio base muestre el aviso de error
    if: ${{ always() && needs.construir.outputs.desplegar == 'true' }}
    runs-on: ubuntu-latest
    # Solo importa el último despliegue: arma el sitio con lo más reciente de main, así ninguno pisa datos de otro curso
    concurrency:
      group: desplegar-pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Armar el sitio
        run: python scripts/cursos.py sitio _sitio "$(git rev-parse --short=8 HEAD)"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _sitio

      - id: pages
        uses: actions/deploy-pages@v4
