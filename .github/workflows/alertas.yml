name: Alertas del día anterior

# Todos los días a las 3:00 p. m. de Colombia (y los lunes a las 8:00 a. m., con la revisión de los próximos 7 días) calcula qué le falta a las clases de mañana (docente, enlace de Teams), los choques y los Excel con error.
# APAGADO por defecto: solo publica la alerta si la variable del repositorio ALERTAS_ACTIVAS vale true. Publicar = crear una incidencia en el
# repositorio PRIVADO avisos-internos (con el secreto AVISOS_TOKEN), que un flujo de Power Automate convierte en correo. Ejecutado a mano con "enviar" en falso solo muestra el texto en el resumen, sin publicar nada.
on:
  schedule:
    - cron: '0 20 * * *'
    - cron: '0 13 * * 1'
  workflow_dispatch:
    inputs:
      enviar:
        description: 'Publicar la alerta de verdad (en falso solo se muestra en el resumen)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  alertas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Calcular las alertas de mañana
        id: calc
        run: |
          # lunes 8:00 a. m. de Colombia: revisión de la semana; el resto, solo mañana
          if [ "${{ github.event.schedule }}" = '0 13 * * 1' ]; then SEMANA=--semana; fi
          python scripts/alertas.py $SEMANA --html alerta.html | tee salida.txt
          {
            echo "## Alertas de mañana"
            cat salida.txt
            echo
            echo 'Vista previa del cuerpo:'
            echo
            cat alerta.html
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar la alerta
        if: steps.calc.outputs.hay == 'true' && ((github.event_name == 'schedule' && vars.ALERTAS_ACTIVAS == 'true') || (github.event_name == 'workflow_dispatch' && inputs.enviar))
        env:
          GH_TOKEN: ${{ secrets.AVISOS_TOKEN }}
          COLA: ${{ github.repository_owner }}/avisos-internos
          RESPONSABLE: ${{ vars.RESPONSABLE_AVISOS }}
          TITULO: ${{ steps.calc.outputs.titulo }}
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "Falta el secreto AVISOS_TOKEN: no se publicó nada." >> "$GITHUB_STEP_SUMMARY"; exit 0; fi
          gh label create alerta-cronogramas -R "$COLA" --color B60205 2>/dev/null || true
          gh issue create -R "$COLA" --title "$TITULO" --body-file alerta.html --label alerta-cronogramas --assignee "$RESPONSABLE"
          echo "Alerta publicada en la cola interna." >> "$GITHUB_STEP_SUMMARY"

      - name: Aviso de que no se publicó
        if: steps.calc.outputs.hay == 'true' && !((github.event_name == 'schedule' && vars.ALERTAS_ACTIVAS == 'true') || (github.event_name == 'workflow_dispatch' && inputs.enviar))
        run: echo "Hay alertas, pero el envío está apagado (ALERTAS_ACTIVAS no es true). No se publicó nada." >> "$GITHUB_STEP_SUMMARY"
