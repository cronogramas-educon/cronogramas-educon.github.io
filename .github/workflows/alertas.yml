name: Alertas del día anterior

# Todos los días a las 3:00 p. m. de Colombia calcula qué le falta a las clases de mañana (docente, enlace de Teams), los choques y los Excel con error.
# APAGADO por defecto: solo publica la alerta (una incidencia que un flujo de Power Automate convierte en correo) si la variable del repositorio
# ALERTAS_ACTIVAS vale true. Ejecutado a mano con "enviar" en falso solo muestra el texto en el resumen, sin publicar nada.
on:
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch:
    inputs:
      enviar:
        description: 'Publicar la alerta de verdad (en falso solo se muestra en el resumen)'
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

jobs:
  alertas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Calcular las alertas de mañana
        id: calc
        run: |
          python scripts/alertas.py --html alerta.html | tee salida.txt
          {
            echo "## Alertas de mañana"
            cat salida.txt
            echo
            echo 'Vista previa del cuerpo:'
            echo
            cat alerta.html
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar la alerta
        if: steps.calc.outputs.hay == 'true' && ((github.event_name == 'schedule' && vars.ALERTAS_ACTIVAS == 'true') || (github.event_name == 'workflow_dispatch' && inputs.enviar))
        env:
          GH_TOKEN: ${{ github.token }}
          TITULO: ${{ steps.calc.outputs.titulo }}
        run: |
          gh label create alerta-cronogramas --color B60205 --description "Alerta diaria que se envía por correo" 2>/dev/null || true
          url=$(gh issue create --title "$TITULO" --body-file alerta.html --label alerta-cronogramas)
          gh issue close "$url" --comment "Procesada."
          echo "Alerta publicada: $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Aviso de que no se publicó
        if: steps.calc.outputs.hay == 'true' && !((github.event_name == 'schedule' && vars.ALERTAS_ACTIVAS == 'true') || (github.event_name == 'workflow_dispatch' && inputs.enviar))
        run: echo "Hay alertas, pero el envío está apagado (ALERTAS_ACTIVAS no es true). No se publicó nada." >> "$GITHUB_STEP_SUMMARY"
